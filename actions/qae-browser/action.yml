name: Vibe Verifier QAE browser
description: Install the browser toolchain the QAE harness drives, playwright-mcp and the Playwright build it pins, from the catalog's lockfile, then the chromium that build wants.
outputs:
  mcp:
    description: The playwright-mcp entry point, for the explorer's --mcp-config.
    value: ${{ steps.install.outputs.mcp }}
runs:
  using: composite
  steps:
    - name: Install the browser toolchain from the lockfile
      id: install
      shell: bash
      run: |
        set -euo pipefail
        # tools/qae-browser/package-lock.json fixes every tarball's integrity; npx -y would resolve
        # them from the registry on each run, in the job that holds the account-level token.
        dir=$(python3 "$GITHUB_ACTION_PATH/../../bin/vibe-verifier" tool qae-browser)
        echo "mcp=$dir/node_modules/@playwright/mcp/cli.js" >> "$GITHUB_OUTPUT"
        # chromium comes from the Playwright build the lockfile pins, so the browser matches the mcp.
        # Its system packages are installed here only where this job can install them: as root, or
        # through passwordless sudo, as on GitHub's hosted runners. A self-hosted runner whose user
        # cannot sudo carries them already (harnesses/qae/README.md, "What the runner needs"), and
        # asking would stop the job at a password prompt.
        if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
          "$dir/node_modules/.bin/playwright" install --with-deps chromium
        else
          "$dir/node_modules/.bin/playwright" install chromium
        fi
