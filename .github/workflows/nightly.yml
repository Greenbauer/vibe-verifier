name: Nightly

# coverage-not-lost on this repository's whole suite, report-only, once a night on main. It compares the main commit
# the last successful nightly ran on with today's: a line lost in between is a warning on that night's run, and its
# log names the commits, and so the pull requests, merged since. Pull requests run the gate on the dashboard tests only
# (.vibe-verifier-tests, in ci.yml): on the whole suite it takes about an hour. workflow_dispatch runs it on demand;
# with `base`, from that commit, and the next night then starts from its head, so a `base` newer than the last
# nightly's steps past the commits in between (for a range whose suite can no longer run).
#
# No step that runs tests holds a credential: the job's only one is its own read-only token, given to the step that
# looks up the last nightly. The tests run every gate against temporary git repositories, with gh, curl and the
# services the gates call (GitHub's API, preview deployments, model APIs) stubbed or recorded, so nothing here
# reaches a production database, URL or person (tests/test_ci_workflow.py holds the workflow to that).

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: >-
          The commit to compare from (default the main commit the last successful nightly ran on). The next night
          starts from this run's head, so a base newer than the last nightly's skips the commits in between
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  coverage-not-lost:
    name: coverage-not-lost
    runs-on: ubuntu-latest
    # Above the gate's --timeout (4800 seconds, below), so a run past it says so (exit 2) before the job is killed.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # gh run list, for the commit the last successful nightly ran on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The commit to compare from
        # `base` when the run was dispatched with one; else the commit of the last successful nightly on main (one
        # that could not run, exit 2, judged nothing, so its range is judged again); else, until a run succeeds, the
        # commit before the one that added this workflow, so no night's range goes unjudged.
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASKED: ${{ inputs.base }}
        run: |
          base="$ASKED"
          if [ -z "$base" ]; then
            base=$(gh run list --repo "$REPO" --workflow nightly.yml --branch main --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')
          fi
          if [ -z "$base" ]; then
            added=$(git log --diff-filter=A --format=%H -- .github/workflows/nightly.yml | tail -n 1)
            base=$(git rev-parse "$added^")
          fi
          echo "Comparing $base with $(git rev-parse HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: coverage-not-lost on the whole suite
        uses: ./actions/gates # zizmor: ignore[self-repository]
        # The gate's line is here, not in a manifest file: the runner judges a manifest file from the base, the last
        # nightly's commit, so a change to it would wait a night, or never apply after a night that could not run.
        # `entries:` is never judged from a base, and main's workflow is reviewed. --timeout: each side took 784 to
        # 1030 seconds on ubuntu-latest (pull request #220), and the second pair runs every time here (the first
        # side fills the runner's empty tool cache, so the install lines of gates/_tools.py run only at the base):
        # four sides, at most 3961 seconds, plus room.
        with:
          entries: coverage-not-lost --soak --runner unittest --args "discover -s tests" --timeout 4800
          base-ref: ${{ steps.base.outputs.base }}
