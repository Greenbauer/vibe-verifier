name: Vibe Verifier criteria
description: Read a pull request body's acceptance criteria and changed paths, so a harness can skip work the PR needs none of.
inputs:
  path:
    description: The PR body, or any criteria document, relative to the workspace.
    required: true
  changed-files:
    description: >-
      The pull request's changed paths, one per line, relative to the workspace. Given, a PR that lists
      no criteria and changes only CI configuration or documentation no site renders needs no check.
    default: ""
  ticket:
    description: >-
      The acceptance criteria of the ticket the pull request implements, written by the consumer's own step,
      relative to the workspace. Counted in addition to the PR body's (as TC1, TC2, ...), so a PR cannot
      declare or leave its ticket's requirements away. An empty file links no ticket. Empty (the default)
      reads none.
    default: ""
  max-shards:
    description: >-
      The most explorers a pull request's criteria may be split across, to run in parallel (the `shards`
      output). One walk is a criterion as one role it names at one width, an explorer is sized for six, and
      1 (the default) never splits. A criterion is never split, nor are criteria that name each other by
      number ("the record from item 2", "after AC3"): one explorer walks such a chain whole, in order. More needs that many QAE runners at once; with fewer the explorers queue.
    default: "1"
  manifest:
    description: >-
      The QAE manifest, relative to the workspace, as the workflow fetched it: the --widths of its
      qae-artifacts line count toward the walks the shards are sized to. A subscribed ticket-coverage line
      runs before any browser skip, requiring a full-history checkout. Empty (the default) counts one width
      and runs no traceability check.
    default: ""
  entries:
    description: >-
      The QAE gate list itself, one gate per line, in place of `manifest`, as a wrapper passes it to
      actions/gates.
    default: ""
  token:
    description: >-
      A token that can read the repository's actions, contents and pull requests (the job's GITHUB_TOKEN
      with `actions: read`). Given, a pull request whose last QAE walk passed, and that changed since only
      in files no browser can see, with its body not edited since, needs no new walk: its verdict is
      carried (carry_facts.py says what is read). Empty (the default) never carries. The facts read are
      the `carry` output; a later job passes them back as `carry` to decide on the same facts.
    default: ""
  carry:
    description: >-
      The facts an earlier job's run of this action read (its `carry` output), written to a file,
      relative to the workspace, in place of `token`: the verify job decides on the facts the criteria
      job decided on, so the two cannot disagree about a carry.
    default: ""
outputs:
  count:
    description: How many criteria the document lists. 0 when it needs no check, and 0 when it lists none.
    value: ${{ steps.read.outputs.count }}
  declared-none:
    description: >-
      Why no browser check is needed (the reason the document declares, or that every changed path is
      unrendered); empty when one is.
    value: ${{ steps.read.outputs.declared-none }}
  carried-from:
    description: The head whose passing walk this head carries, when it does (see `token`); empty otherwise.
    value: ${{ steps.read.outputs.carried-from }}
  carry:
    description: The facts read with `token`, as one line of JSON, for a later job's `carry`; empty without them.
    value: ${{ steps.read.outputs.carry }}
  ticket:
    description: >-
      The text of the `ticket` file, unchanged (empty without one), so the jobs after this one judge the
      ticket this job counted rather than fetching it again.
    value: ${{ steps.read.outputs.ticket }}
  shards:
    description: >-
      The explore job's matrix, a JSON array with one value per explorer: `[""]` for one, `["",2,3]` for
      three (never more than `max-shards`). The first value is blank and stands for 1 (`matrix.shard || 1`):
      GitHub names a matrix job `<name> (<value>)` and leaves a blank value out, so the first explorer keeps
      the job's own name, and a required check or a dashboard that names `qae-explore` still finds it.
    value: ${{ steps.read.outputs.shards }}
runs:
  using: composite
  steps:
    - name: Read the criteria
      id: read
      shell: bash
      env:
        VV_PATH: ${{ inputs.path }}
        VV_CHANGED: ${{ inputs.changed-files }}
        VV_TICKET: ${{ inputs.ticket }}
        VV_MAX_SHARDS: ${{ inputs.max-shards }}
        VV_MANIFEST: ${{ inputs.manifest }}
        VV_ENTRIES: ${{ inputs.entries }}
        GH_TOKEN: ${{ inputs.token }}
        VV_REPO: ${{ github.repository }}
        VV_PR: ${{ github.event.pull_request.number }}
        VV_HEAD: ${{ github.event.pull_request.head.sha }}
        VV_BRANCH: ${{ github.event.pull_request.head.ref }}
        VV_BASE: ${{ github.event.pull_request.base.ref }}
        VV_CARRY: ${{ inputs.carry }}
        VV_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        args=(criteria "$VV_PATH" --max-shards "$VV_MAX_SHARDS")
        carry=""
        if [ -n "${VV_CARRY:-}" ]; then
          # An empty file: the earlier job read no facts, so nothing is carried.
          if [ -s "$VV_CARRY" ]; then carry="$VV_CARRY"; fi
        elif [ -n "${GH_TOKEN:-}" ] && [ -n "${VV_PR:-}" ]; then
          carry="$RUNNER_TEMP/vibe-verifier-carry.json"
          python3 "$GITHUB_ACTION_PATH/carry_facts.py" --repo "$VV_REPO" --pr "$VV_PR" --head "$VV_HEAD" \
            --branch "$VV_BRANCH" --base "$VV_BASE" --run-id "$VV_RUN_ID" --body "$VV_PATH" --out "$carry"
        fi
        carry_json=""
        if [ -n "$carry" ]; then
          args+=(--carry "$carry")
          carry_json=$(python3 -c 'import json, sys; print(json.dumps(json.load(open(sys.argv[1]))))' "$carry")
        fi
        if [ -n "$VV_CHANGED" ]; then args+=(--changed-files "$VV_CHANGED"); fi
        if [ -n "$VV_TICKET" ]; then args+=(--ticket "$VV_TICKET"); fi
        manifest="$VV_MANIFEST"
        if [ -n "$VV_ENTRIES" ]; then
          manifest="$RUNNER_TEMP/vibe-verifier-qae-entries"
          printf '%s\n' "$VV_ENTRIES" > "$manifest"
        fi
        if [ -n "$manifest" ]; then args+=(--manifest "$manifest"); fi
        out=$(python3 "$GITHUB_ACTION_PATH/../../bin/vibe-verifier" "${args[@]}")
        echo "$out"
        # The first line decides; the lines after it name each criterion's annotations, for the log.
        first=${out%%$'\n'*}
        case "$first" in
          none:*)     echo "count=0" >> "$GITHUB_OUTPUT"; echo "declared-none=${first#none: }" >> "$GITHUB_OUTPUT" ;;
          criteria:*) echo "count=${first#criteria: }" >> "$GITHUB_OUTPUT"; echo "declared-none=" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::unexpected output from vibe-verifier criteria: $first"; exit 2 ;;
        esac
        # The ticket's text as a multi-line output, under a delimiter its text cannot hold.
        delimiter="VV_TICKET_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
        { echo "ticket<<$delimiter"; if [ -n "$VV_TICKET" ]; then cat "$VV_TICKET"; echo; fi; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
        # The `shards: [1,2,3]` line as the explore job's matrix, the first value blank (see the output's
        # description). A pull request that needs no check prints no such line and gets the one explorer.
        shards=$(printf '%s\n' "$out" | sed -n 's/^shards: \[1\(\(,[0-9][0-9]*\)*\)\]$/[""\1]/p')
        if [ -z "$shards" ]; then shards='[""]'; fi
        echo "shards=$shards" >> "$GITHUB_OUTPUT"
        # The carried walk's head, and the facts it was decided on for a later job (one JSON line).
        carried=$(printf '%s\n' "$out" | sed -n 's/^carried: \([0-9a-f]\{40\}\) .*/\1/p')
        echo "carried-from=$carried" >> "$GITHUB_OUTPUT"
        echo "carry=$carry_json" >> "$GITHUB_OUTPUT"
