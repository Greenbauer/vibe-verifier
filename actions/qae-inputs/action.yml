name: Vibe Verifier QAE inputs
description: Before the QAE explorer runs, copy the design references the site step supplied into the evidence, list them for the explorer, and declare their digests so the verify job's gate judges the images the workflow supplied; write the viewport widths the QAE manifest's qae-artifacts line requires, for the explorer; and declare the explorer's turn cap, sized to what it walks, and its share of the criteria when they are split across several explorers.
inputs:
  manifest:
    description: >-
      The QAE manifest, relative to the workspace. The --widths of its qae-artifacts line (judged from the
      base) are written to qae-inputs/widths, one per line; without --widths no file is written.
    default: .vibe-verifier-qae
  entries:
    description: >-
      The QAE gate list itself, one gate per line, in place of `manifest`, as a wrapper passes it to
      actions/gates. Written outside the repository, so it is never judged from the base.
    default: ""
  references:
    description: Where the site step wrote each design reference as <key>.png, relative to the workspace. Absent or empty supplies none.
    default: qae-inputs/references
  evidence:
    description: The explorer's artifact directory; each reference is copied to its references/<key>.png.
    default: qae-artifacts
  shard:
    description: >-
      Which explorer this is, of the `shards` that share the pull request's criteria (`matrix.shard || 1` in
      the explore job). The turn cap is sized to its share, which the `share` output names.
    default: "1"
  shards:
    description: >-
      How many explorers the criteria job split the criteria across (`strategy.job-total` in the explore
      job). Each is given its share by the assignment the criteria job counted with.
    default: "1"
outputs:
  references:
    description: >-
      The supplied references as one JSON object of key to the sha256 of its image ({} when none). The
      explore job passes it to the verify job, which writes it to qae-inputs/references.json for
      acceptance-verdict --references: a step output, because the explorer can write under the evidence
      directory and must not choose which image a criterion is judged against.
    value: ${{ steps.prepare.outputs.references }}
  max-turns:
    description: >-
      The explorer's turn cap, for claude-code-action's --max-turns on the Claude lane (the Codex CLI takes
      no such limit; its job's timeout bounds it). One walk is one criterion of qae-inputs/pr-body.md or
      qae-inputs/ticket.md at one width of qae-inputs/widths as one role it names, or up to three states of
      one feature in qae-inputs/features/ (the acceptance-verdict line's --max-states, default 3, is how many
      states of each are walked); the cap is 40 plus 30 a walk, never below 80 nor above 240 (the numbers
      behind it: TURNS_BASE in bin/vibe-verifier). The explore job writes those inputs before this step runs.
      One explorer of several is sized to its own share.
    value: ${{ steps.prepare.outputs.max-turns }}
  share:
    description: >-
      The sentence that names this explorer's share of the criteria, for its prompt: "Your share of the
      criteria is AC1, AC4, TC2: ...". Written by code from the criteria's own numbers, so the model never
      works its share out. Empty for one explorer, which walks them all.
    value: ${{ steps.prepare.outputs.share }}
runs:
  using: composite
  steps:
    - name: Prepare the explorer's inputs
      id: prepare
      shell: bash
      env:
        VV_MANIFEST: ${{ inputs.manifest }}
        VV_ENTRIES: ${{ inputs.entries }}
        VV_REFERENCES: ${{ inputs.references }}
        VV_EVIDENCE: ${{ inputs.evidence }}
        VV_SHARD: ${{ inputs.shard }}
        VV_SHARDS: ${{ inputs.shards }}
      run: |
        set -euo pipefail
        manifest="$VV_MANIFEST"
        if [ -n "$VV_ENTRIES" ]; then
          manifest="$RUNNER_TEMP/vibe-verifier-qae-entries"
          printf '%s\n' "$VV_ENTRIES" > "$manifest"
        fi
        digests="$RUNNER_TEMP/vv-reference-digests.json"
        turns="$RUNNER_TEMP/vv-explorer-turns"
        share="$RUNNER_TEMP/vv-explorer-share"
        python3 "$GITHUB_ACTION_PATH/../../bin/vibe-verifier" qae-inputs --manifest "$manifest" --references "$VV_REFERENCES" \
          --evidence "$VV_EVIDENCE" --listing "$VV_REFERENCES.md" --digests "$digests" --widths-file qae-inputs/widths \
          --turns "$turns" --shard "$VV_SHARD" --shards "$VV_SHARDS" --share "$share"
        echo "references=$(cat "$digests")" >> "$GITHUB_OUTPUT"
        echo "max-turns=$(cat "$turns")" >> "$GITHUB_OUTPUT"
        echo "share=$(cat "$share")" >> "$GITHUB_OUTPUT"
