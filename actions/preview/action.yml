name: Vibe Verifier preview
description: Record the address of a pull request's preview, and the database it reads, from the job that proved it, or wait for that job to pass and find them. One answer for every check that tests the preview.
inputs:
  record:
    description: The preview address to record (https://...), from the job that set the preview up and proved it serves. Empty (the default) finds the address instead.
    default: ""
  database:
    description: To record, the Supabase project ref of the database the preview reads (its branch database), as the job that pointed the preview at it knows it. Empty (the default) records the address alone.
    default: ""
  check:
    description: To find, the name of the check whose job records the address. The step waits for it to pass on the commit.
    default: ""
  sha:
    description: The commit whose preview it is. Defaults to the pull request's head.
    default: ${{ github.event.pull_request.head.sha }}
  repository:
    description: The repository, owner/name.
    default: ${{ github.repository }}
  wait-minutes:
    description: To find, how long to wait for the check to pass, queued or running.
    default: "40"
  running-minutes:
    description: To find, how long the check may spend running (in_progress) before the wait fails. Empty (the default) allows the whole wait.
    default: ""
  handover:
    description: To find, "true" in a job that hands the wait to a later job. When the wait ends with the check still queued or running, the step passes with an empty `url` instead of failing; every other failure still fails.
    default: "false"
  token:
    description: A token that can write commit statuses (to record) or read checks and statuses (to find).
    default: ${{ github.token }}
outputs:
  url:
    description: The address found, with no trailing slash. Empty when recording, and when a `handover` wait ended with the check still queued or running.
    value: ${{ steps.preview.outputs.url }}
  database:
    description: The Supabase project ref the recording job recorded for the preview's database. Empty when none was recorded, when recording, and when a `handover` wait ended with the check still queued or running.
    value: ${{ steps.preview.outputs.database }}
runs:
  using: composite
  steps:
    - name: Record or find the preview
      id: preview
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RECORD: ${{ inputs.record }}
        DATABASE: ${{ inputs.database }}
        CHECK: ${{ inputs.check }}
        SHA: ${{ inputs.sha }}
        REPO: ${{ inputs.repository }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
        RUNNING_MINUTES: ${{ inputs.running-minutes }}
        HANDOVER: ${{ inputs.handover }}
      run: |
        set -euo pipefail
        [ -n "$SHA" ] || { echo "::error::no commit to record or find a preview for: pass sha outside a pull request event"; exit 1; }
        if [ -n "$RECORD" ]; then
          python3 "$GITHUB_ACTION_PATH/preview.py" record --repo "$REPO" --sha "$SHA" --url "$RECORD" --database "${DATABASE:-}"
          printf 'url=\ndatabase=\n' >> "$GITHUB_OUTPUT"
        else
          [ -n "$CHECK" ] || { echo "::error::to find a preview, name the check that records it (check:)"; exit 1; }
          # The finder prints the address (and on a second line the database, when one was recorded) on
          # success and its ::error:: line on failure, both on stdout; a failure's line is printed again
          # here so the workflow shows it.
          rc=0
          found=$(python3 "$GITHUB_ACTION_PATH/preview.py" find --repo "$REPO" --sha "$SHA" --check "$CHECK" --wait-minutes "$WAIT_MINUTES" --running-minutes "${RUNNING_MINUTES:-0}") || rc=$?
          # 3 is the finder's "still queued or running at the end of the wait": the one failure a
          # later job's wait can turn into an address, so the one a handover passes on.
          if [ "$rc" -eq 3 ] && [ "$HANDOVER" = true ]; then
            echo "::notice::${found#::error::}. Handing the wait over: this step found no address."
            printf 'url=\ndatabase=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || { printf '%s\n' "$found"; exit "$rc"; }
          url=$(printf '%s\n' "$found" | sed -n 1p)
          database=$(printf '%s\n' "$found" | sed -n 2p)
          echo "preview of $SHA: $url${database:+, reading database $database}"
          printf 'url=%s\ndatabase=%s\n' "$url" "$database" >> "$GITHUB_OUTPUT"
        fi
