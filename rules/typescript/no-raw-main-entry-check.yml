id: no-raw-main-entry-check
language: tsx
message: >-
  This entry-point check compares a percent-encoded file URL with the raw process.argv[1], so it
  is false whenever the path contains a space (or a symlink) and main() silently never runs.
  Compare real paths instead: `realpathSync(fileURLToPath(import.meta.url)) === realpathSync(process.argv[1])`.
note: The script exits 0 having done nothing, so a CI path without spaces never notices.
ignores: ['**/node_modules/**']
rule:
  any:
    - pattern: $L === $R
    - pattern: $L == $R
    - pattern: $L !== $R
    - pattern: $L != $R
  all:
    - has:
        stopBy: end
        pattern: process.argv[1]
    - has:
        stopBy: end
        any:
          - kind: template_string
            regex: ^`file://\$\{
          - pattern: new URL(import.meta.url).pathname
