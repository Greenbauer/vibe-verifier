name: CI

# Tests every gate and the runner (on a pull request, also reporting any failed test that affected-test
# selection would have left out), then runs this repository's own manifest through the composite action,
# which is the only place that action executes before a consumer exists, then the gates that run this
# repository's own tests (.vibe-verifier-tests): mutation-testing changed dashboard code, and the report-only
# pilots of regression-test-fails-on-base and coverage-not-lost. The lanes jobs run the runner-lane kit's own suites (lanes/README.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Above everything that can run here: the suite (about 9 minutes) and the limits of the gates that run it
    # again (changed-code-mutation 900 seconds, regression-test-fails-on-base 600, coverage-not-lost 300), so a
    # gate past its own limit says so (exit 2) before the job is killed.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read # gh pr view, for the title and body regression-test-fails-on-base reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gate and runner tests
        id: suite
        # The whole suite, on every event. Its log is kept for the selection report below; pipefail, so the
        # tee never hides a failure.
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
      # Affected-test selection in report mode (actions/affected-tests/README.md), on pull requests only: a push
      # to main runs the full suite only. The selection is printed (selected N of M) and nothing runs from it, so
      # no test is skipped; the report names each test the full run failed that the selection left out, and a
      # miss never fails the job (the full run already did). These steps run after the suite, so a selection
      # that cannot run (exit 2, which fails its step) never stops a test from running.
      - name: Select the affected tests
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: ./actions/affected-tests # zizmor: ignore[self-repository]
        with:
          tests: tests/test*.py
      - name: List the tests the full run failed
        # unittest writes no report a tool reads, so the ids come from its verbose log: the line after each
        # "=====" separator names one failure, as `FAIL: test_x (test_mod.Class.test_x)`, and a module that does
        # not import is `unittest.loader._FailedTest.test_mod`; the report finds each id's file. A failed run
        # with no failure read from its log is an error here, never a report that nothing was missed.
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          LOG: ${{ runner.temp }}/unittest.log
          LIST: ${{ runner.temp }}/failed-tests.txt
          SUITE: ${{ steps.suite.outcome }}
        run: |
          sed -n -E '/^=+$/{n;s/^(FAIL|ERROR|UNEXPECTED SUCCESS): [^ ]+ \(([^)]+)\).*/\2/p;}' "$LOG" \
            | sed -E 's/^unittest\.loader\._FailedTest\.//' | sort -u > "$LIST"
          echo "Full run: $SUITE. Failed tests read from its log: $(wc -l < "$LIST" | tr -d ' ')"
          cat "$LIST"
          if [ "$SUITE" = failure ] && [ ! -s "$LIST" ]; then
            echo "::error title=affected-tests::the full run failed and no failed test could be read from its log"
            exit 1
          fi
      - name: Selection misses
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: ./actions/affected-tests # zizmor: ignore[self-repository]
        with:
          tests: tests/test*.py
          report: ${{ runner.temp }}/failed-tests.txt
      - name: Dogfood the composite action
        # zizmor wants GitHub's July-2026 self-repository form (`uses: $/actions/gates`), which actionlint
        # 1.7.12, the latest release, rejects as an invalid ref. Until actionlint learns it, the
        # workspace-relative form stays and zizmor's finding is ignored here with this reason.
        uses: ./actions/gates # zizmor: ignore[self-repository]
      - name: Install pytest for the mutation gate
        run: |
          python3 -m venv .venv-tests
          .venv-tests/bin/pip install --quiet --disable-pip-version-check --require-hashes --only-binary :all: -r tests/requirements-pytest.txt
      - name: Write the pull request's title and body
        # For regression-test-fails-on-base and coverage-not-lost (.vibe-verifier-tests), as
        # docs/features/regression-test.md writes them. A push has no pull request: its merge base is the head,
        # so no gate there compares anything, and the pushed commit's own subject and body stand in.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p pr-inputs
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --repo "$REPO" --json title --jq .title > pr-inputs/title.txt
            gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body > pr-inputs/body.md
          else
            git log -1 --format=%s > pr-inputs/title.txt
            git log -1 --format=%b > pr-inputs/body.md
          fi
      - name: Gates that run this repository's tests
        # Their own manifest, because only this job installs the project's test runner. changed-code-mutation
        # runs the dashboard suite under pytest once, then each mutant on the changed lines, only when a pull
        # request changes a dashboard .py file. regression-test-fails-on-base and coverage-not-lost are
        # report-only pilots (--soak) under the python3 and unittest of the suite step above.
        uses: ./actions/gates # zizmor: ignore[self-repository]
        with:
          manifest: .vibe-verifier-tests

  # The QAE browser action against a real apt and the pinned Playwright, which its tests stub: it reads
  # the missing system packages from that Playwright's own report, so a pin bump that changes the
  # report shows here before a consumer pins it. Then the chromium it installed has to start, and
  # the harness's two page hooks have to work in the playwright-mcp it installed.
  qae-browser:
    name: qae-browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the QAE browser toolchain
        id: browser
        uses: ./actions/qae-browser # zizmor: ignore[self-repository]
      - name: Start the chromium it installed
        env:
          MCP: ${{ steps.browser.outputs.mcp }}
        run: |
          cd "$(dirname "$MCP")/../.."
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch({ channel: "chromium" });
              const page = await browser.newPage();
              await page.setContent("<h1>started</h1>");
              console.log("chromium", browser.version(), "rendered:", await page.textContent("h1"));
              await browser.close();
            })().catch(error => { console.error(error); process.exit(1); });
          '
      - name: Record which page logged a console error, with the playwright-mcp it installed
        # The page record depends on that build: its --init-page hook, the page it hands the hook and
        # the lines it writes to console-*.log. The test drives it as the explorer does, against a
        # site and a third-party page on local ports, and runs the qae-artifacts gate on the result.
        # It skips without QAE_MCP, so the file is checked first: a skip here must not read as a pass.
        env:
          QAE_MCP: ${{ steps.browser.outputs.mcp }}
          QAE_CONSOLE_PAGES: ${{ steps.browser.outputs.console-pages }}
        run: |
          test -f "$QAE_MCP" && test -f "$QAE_CONSOLE_PAGES"
          python3 -m unittest discover -s tests -p 'test_qae_console_pages.py' -v
      - name: Type a secret's value for its name however it is entered, with the playwright-mcp it installed
        # The secret names hook wraps that build's own Frame, ElementHandle and Keyboard classes, so
        # a pin bump that renames one shows here. The test signs in to a site on a local port the way
        # the run that failed did (browser_run_code_unsafe, the name as the password) and runs the
        # qae-artifacts gate on the result, with the hook and without it. Skips without QAE_MCP.
        env:
          QAE_MCP: ${{ steps.browser.outputs.mcp }}
        run: |
          test -f "$QAE_MCP"
          python3 -m unittest discover -s tests -p 'test_qae_secret_names.py' -v

  # The runner-lane kit (lanes/README.md) is Linux-only and has tests of its own, which stub every
  # system tool on PATH: nothing is installed, mounted or started on the runner. Ubuntu 24.04, not
  # ubuntu-latest: it is the release the kit's machines run, and the pinned PyYAML has wheels for
  # its python3 (none newer than CPython 3.13).
  lanes:
    name: lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Hermetic tests
        # bash 5, jq, git and flock are the runner's; PyYAML comes from the committed requirements
        # file, by digest, into a throwaway environment whose python3 the tests run.
        run: |
          python3 -m venv "$RUNNER_TEMP/lanes-venv"
          "$RUNNER_TEMP/lanes-venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            --require-hashes --only-binary :all: --no-deps -r lanes/tests/requirements.txt
          PATH="$RUNNER_TEMP/lanes-venv/bin:$PATH" lanes/tests/run-all.sh

  lanes-listener:
    name: lanes-listener
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gofmt, go vet and go test
        # In the Go image the machines build the listener with, pinned by digest in build.sh.
        run: lanes/listener/build.sh test
