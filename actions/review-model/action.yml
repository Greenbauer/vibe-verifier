name: Vibe Verifier review model
description: Names the model the code review runs on. The review workflow reads it at its catalog pin, so the one line below is the only place the model is written, and a new model reaches every subscribed copy when its pin moves.
outputs:
  name:
    description: The model identifier the review passes to `--model`.
    value: ${{ steps.model.outputs.name }}
runs:
  using: composite
  steps:
    - name: Name the review model
      id: model
      shell: bash
      env:
        # The one place the review model is written (harnesses/review/README.md, "The model follows the pin").
        REVIEW_MODEL: claude-opus-4-7
      run: |
        echo "Code review model: ${REVIEW_MODEL}"
        echo "name=${REVIEW_MODEL}" >> "$GITHUB_OUTPUT"
