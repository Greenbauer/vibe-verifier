# pytest, for the mutation step in ci.yml only: the suite itself runs under unittest. changed-code-mutation
# runs the project's own pytest on dashboard/ (.vibe-verifier-tests), so pytest collects the dashboard
# tests and nothing else: the whole suite under mutmut's coverage tracing took over 900 seconds, and
# gates/new_source_has_test.py matches pytest's default *_test.py pattern.
[pytest]
testpaths = tests
python_files = test_dashboard_*.py
