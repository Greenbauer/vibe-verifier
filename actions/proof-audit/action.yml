name: Vibe Verifier proof audit
description: >-
  Grade, cold, whether a repository's tests prove each requirement its pull request's Ticket sections, or a plan it
  names in a plan store, define, and hold the grades to the repository. Three modes, one per job
  (harnesses/proof-audit/README.md): `plan` on any runner, `grade` on a runner holding a ChatGPT-managed Codex
  login, one job per shard, and `verify`, which runs the proof-audit gate and posts its per-ID table.
inputs:
  mode:
    description: plan, grade or verify.
    required: true
  body:
    description: >-
      plan and verify: the pull request's body, written by the workflow outside the workspace ($RUNNER_TEMP) for
      plan, so a model never reads it. Its `Ticket:` lines name the requirements, and so may its plan markers.
    default: ""
  title:
    description: plan and verify, the pull request's title, read for a `[plan:<id>]` marker as the body is. Empty reads none.
    default: ""
  plans-endpoint:
    description: >-
      plan and verify, a plan store's API base, as actions/ticket's: each plan a `[plan:<id>]` marker in the title or
      body names, `GET <endpoint>/plans/<id>` with its amendments, is graded whole (harnesses/proof-audit/README.md).
      Give both modes the same value. Empty (the default) reads no plan store.
    default: ""
  plans-token:
    description: plan and verify, the bearer token the plan store reads plans with, a secret of the consumer's. Needed with plans-endpoint.
    default: ""
  plan:
    description: grade, the plan job's `plan` output (the requirements cut into shards, as JSON).
    default: ""
  shard:
    description: grade, which shard of the plan this job grades (`matrix.shard`).
    default: ""
  grades:
    description: >-
      grade: the directory the shard's `<K>.json` is written to, absolute or relative to the workspace. verify: the
      directory the grade jobs' artifacts were downloaded to (each artifact in a folder of its own). Pass a
      `proof-audit-grades` directory under the runner's temporary directory (`runner.temp`) to both, outside the
      checkout of the pull request being judged
      (harnesses/proof-audit/README.md, "Grades the pull request supplies"): the gate judges no grades the checkout
      tracks or links. The default, inside the workspace, is kept for workflows written before that.
    default: proof-audit-grades
  max-ids:
    description: plan, the most requirements one model run grades; more are split into shards graded in parallel.
    default: "10"
  model:
    description: grade, the Codex model. Empty preserves the runner's model selection.
    default: ""
  reasoning-effort:
    description: grade, low, medium, high, xhigh, max or ultra. Empty preserves the runner's selection.
    default: ""
  codex-home:
    description: grade, the Codex home holding the runner's login, as actions/qae-codex's. Empty means $HOME/.codex-qae.
    default: ""
  timeout:
    description: grade, the seconds one shard may take before it is stopped and recorded as not graded.
    default: "3000"
  sandbox:
    description: >-
      grade, Codex's sandbox: danger-full-access (the default, as actions/qae-codex runs) or read-only. On a Linux
      runner in an unprivileged container Codex's read-only sandbox (bubblewrap) cannot set up its network namespace
      ("bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted") and every read the model tries fails, so it
      grades everything UNPROVEN; measured on a consumer's lane, 2026-10-15. The model is told only to read, the job
      holds no token, and a run that changed the working tree is refused.
    default: danger-full-access
  require-ticket:
    description: >-
      verify, globs (one per line) of the paths a pull request may change only when its body links a plan section
      with a `Ticket:` line or says why none applies on a `No ticket: <why>` line, such as the application's source.
      Empty requires neither. A body that claims `[req: ID]` items with no Ticket line fails either way.
    default: ""
  soak:
    description: >-
      verify, "true" to report only: the per-ID table is summarized and posted as always, and an UNPROVEN requirement
      does not fail the step (the gate's common --soak). A gate that could not run fails the step all the same.
    default: "false"
  token:
    description: verify, a token that may comment on the pull request; the table is posted, or edited in place, as one comment. Empty posts none (the step summary still has it).
    default: ""
outputs:
  count:
    description: plan, how many requirements the linked sections define (0 with no Ticket line).
    value: ${{ steps.plan.outputs.count }}
  shards:
    description: plan, the grade jobs' matrix, a JSON array of shard numbers (`[]` when there is nothing to grade).
    value: ${{ steps.plan.outputs.shards }}
  plan:
    description: plan, the requirements cut into shards, as one line of JSON, for the grade jobs' `plan`.
    value: ${{ steps.plan.outputs.plan }}
runs:
  using: composite
  steps:
    - name: Plan the proof audit
      id: plan
      if: inputs.mode == 'plan'
      shell: bash
      env:
        VV_BODY: ${{ inputs.body }}
        VV_MAX_IDS: ${{ inputs.max-ids }}
        VV_TITLE: ${{ inputs.title }}
        VV_PLANS_ENDPOINT: ${{ inputs.plans-endpoint }}
        VV_PLANS_TOKEN: ${{ inputs.plans-token }}
        VV_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/proof-audit-plan.json"
        # Free text goes in as --name=value: a title such as `-WIP` would otherwise read as an option.
        out=$(python3 "$GITHUB_ACTION_PATH/../../bin/vibe-verifier" proof-audit --body "$VV_BODY" --title="$VV_TITLE" \
          --plans-endpoint="$VV_PLANS_ENDPOINT" --pr="$VV_PR" --plan "$plan" --max-ids="$VV_MAX_IDS")
        echo "$out"
        count=$(printf '%s\n' "$out" | sed -n 's/^requirements: \([0-9][0-9]*\)$/\1/p')
        shards=$(printf '%s\n' "$out" | sed -n 's/^shards: \(\[[0-9,]*\]\)$/\1/p')
        if [ -z "$count" ] || [ -z "$shards" ]; then echo "::error::unexpected output from vibe-verifier proof-audit --plan"; exit 2; fi
        { echo "count=$count"; echo "shards=$shards"; echo "plan=$(cat "$plan")"; } >> "$GITHUB_OUTPUT"
    - name: Grade one shard
      if: inputs.mode == 'grade'
      shell: bash
      env:
        VV_PLAN: ${{ inputs.plan }}
        VV_SHARD: ${{ inputs.shard }}
        VV_GRADES: ${{ inputs.grades }}
        VV_MODEL: ${{ inputs.model }}
        VV_EFFORT: ${{ inputs.reasoning-effort }}
        VV_CODEX_HOME: ${{ inputs.codex-home }}
        VV_TIMEOUT: ${{ inputs.timeout }}
        VV_SANDBOX: ${{ inputs.sandbox }}
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/proof-audit-plan.json"
        printf '%s' "$VV_PLAN" > "$plan"
        python3 "$GITHUB_ACTION_PATH/../../bin/vibe-verifier" proof-audit --requirements "$plan" --shard "$VV_SHARD" \
          --grades "$VV_GRADES" --codex-home "${VV_CODEX_HOME:-$HOME/.codex-qae}" --model="$VV_MODEL" \
          --reasoning-effort="$VV_EFFORT" --timeout "$VV_TIMEOUT" --sandbox "$VV_SANDBOX" --format github
    - name: Hold the grades to the repository
      if: inputs.mode == 'verify'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VV_BODY: ${{ inputs.body }}
        VV_GRADES: ${{ inputs.grades }}
        VV_REQUIRE_TICKET: ${{ inputs.require-ticket }}
        VV_TITLE: ${{ inputs.title }}
        VV_PLANS_ENDPOINT: ${{ inputs.plans-endpoint }}
        VV_PLANS_TOKEN: ${{ inputs.plans-token }}
        VV_SOAK: ${{ inputs.soak }}
        VV_REPO: ${{ github.repository }}
        VV_PR: ${{ github.event.pull_request.number }}
        VV_HEAD: ${{ github.event.pull_request.head.sha }}
        VV_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        table="$RUNNER_TEMP/proof-audit-table.md"
        rm -f "$table"
        required=()
        while IFS= read -r glob; do
          glob="${glob#"${glob%%[![:space:]]*}"}"; glob="${glob%"${glob##*[![:space:]]}"}"
          [ -n "$glob" ] && required+=("--require-ticket=$glob")
        done <<< "$VV_REQUIRE_TICKET"
        soak=()
        if [ "$VV_SOAK" = "true" ]; then soak=(--soak); fi
        # GitHub runs `shell: bash` with -e: without `|| code=$?` a failing gate ends the step here, before its
        # table reaches the step summary and the comment, which is when the author needs it.
        code=0
        python3 "$GITHUB_ACTION_PATH/../../gates/proof_audit.py" --body "$VV_BODY" --grades "$VV_GRADES" \
          --table "$table" --format github --title="$VV_TITLE" --plans-endpoint="$VV_PLANS_ENDPOINT" --pr="$VV_PR" \
          ${required[@]+"${required[@]}"} ${soak[@]+"${soak[@]}"} || code=$?
        [ -s "$table" ] || printf '## Proof audit: could not run (the gate wrote no table; its log says why)\n' > "$table"
        cat "$table" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$GH_TOKEN" ] && [ -n "$VV_PR" ]; then
          # One comment per pull request, edited in place: the table of the latest run, with the head it judged
          # as a link (docs/comments.md).
          marker='<!-- vibe-verifier:proof-audit -->'
          comment="$RUNNER_TEMP/proof-audit-comment.json"
          python3 - "$table" "$marker" "$VV_HEAD" "$VV_RUN" "$comment" <<'PY'
        import json, sys
        table, marker, head, run, out = sys.argv[1:]
        text = open(table, encoding="utf-8").read().rstrip("\n")
        commit = "%s/commit/%s" % (run.split("/actions/runs/")[0], head)
        json.dump({"body": "%s\n%s\n\nOn [this commit](%s). [The run and its evidence](%s). Each PROVEN quote was checked against the file; a grade is the model's, its quotes are not." % (marker, text, commit, run)}, open(out, "w"))
        PY
          found=$(gh api --paginate "repos/$VV_REPO/issues/$VV_PR/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1) || found=""
          if [ -n "$found" ]; then
            gh api -X PATCH "repos/$VV_REPO/issues/comments/$found" --input "$comment" > /dev/null || echo "::warning::could not edit the proof audit comment"
          else
            gh api -X POST "repos/$VV_REPO/issues/$VV_PR/comments" --input "$comment" > /dev/null || echo "::warning::could not post the proof audit comment"
          fi
        fi
        exit "$code"
